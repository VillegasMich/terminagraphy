[package]
name = "terminagraphy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
